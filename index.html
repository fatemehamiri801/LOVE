<style>
:root{--bg1:#ffe6ee;--bg2:#e6e4f8;--card:rgba(255,255,255,.86);--ink:#4a3a52;--soft:#8d7f98;--accent:#ee6f9a;--f1:#ffc2d4;--f2:#e3dcf7;--f3:#dcdbe6;--f4:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1f35;--bg2:#1d2040;--card:rgba(60,46,78,.9);--ink:#fbeaf3;--soft:#c6b5d3;--accent:#ff8fb2;--f1:#7a4b64;--f2:#5a4c86;--f3:#575470;--f4:#6a5a86}}
:root[data-theme="dark"]{--bg1:#2b1f35;--bg2:#1d2040;--card:rgba(60,46,78,.9);--ink:#fbeaf3;--soft:#c6b5d3;--accent:#ff8fb2;--f1:#7a4b64;--f2:#5a4c86;--f3:#575470;--f4:#6a5a86}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 8%,var(--bg1),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg2);overflow-x:hidden}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.fl{position:fixed;bottom:-40px;z-index:0;pointer-events:none;animation:rise linear forwards;opacity:.75}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;position:relative;z-index:1;transition:opacity .8s,transform .8s}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
.hug{width:min(86vw,380px);height:auto;overflow:visible}
.hug .pulse{transform-origin:150px 22px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.22)}}
.hug .sway{transform-origin:150px 250px;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.hug .mini{animation:up 3s ease-in infinite;opacity:0}
.hug .mini:nth-of-type(2){animation-delay:1s}.hug .mini:nth-of-type(3){animation-delay:2s}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.t1{font-size:1.1rem;color:var(--soft);margin:18px 0 0}
.t2{font-size:clamp(2.3rem,10vw,3.4rem);font-weight:800;margin:2px 0;color:var(--accent);letter-spacing:-1px}
.date{display:inline-block;margin:8px 0 6px;padding:8px 26px;border-radius:99px;background:var(--card);font-size:1.5rem;font-weight:800;box-shadow:0 10px 30px rgba(238,111,154,.28)}
.t3{color:var(--soft);margin:6px 0 26px}
.go{border:0;background:linear-gradient(135deg,#ff8db1,#ee6f9a);color:#fff;font-weight:800;font-size:1.2rem;padding:15px 38px;border-radius:99px;box-shadow:0 12px 28px rgba(238,111,154,.45);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
#main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:22px 16px 70px;animation:fade 1s}
@keyframes fade{from{opacity:0;transform:translateY(16px)}}
#main .hug{width:min(60vw,220px);display:block;margin:0 auto}
h1{text-align:center;font-size:1.8rem;font-weight:800;margin:4px 0 4px}
.sub{text-align:center;color:var(--soft);margin:0}
.count{text-align:center;margin:14px auto 18px;display:table;background:var(--card);border-radius:99px;padding:6px 18px;font-weight:600;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 8px}
@media (min-width:480px){.grid{grid-template-columns:repeat(8,1fr)}}
.h{position:relative;aspect-ratio:1;border:0;background:none;padding:0;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.h svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--f);filter:drop-shadow(0 4px 5px rgba(190,100,140,.22))}
.h b{position:relative;padding-top:4px;font-size:.95rem;color:var(--ink)}
.h:hover{transform:scale(1.14) rotate(-5deg)}
.h:nth-child(4n+1){--f:var(--f1)}.h:nth-child(4n+2){--f:var(--f2)}.h:nth-child(4n+3){--f:var(--f3)}.h:nth-child(4n){--f:var(--f4)}
.h.seen{--f:var(--accent)!important}.h.seen b{color:#fff}
#sheet{position:fixed;inset:0;z-index:5;background:rgba(60,30,60,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.box{width:min(100%,440px);background:var(--card);border-radius:36px;padding:26px 24px 22px;text-align:center;box-shadow:0 24px 70px rgba(80,30,80,.35);animation:pop .6s cubic-bezier(.2,1.4,.4,1);position:relative}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
.big{width:92px;height:84px;margin:-62px auto 6px;position:relative;display:grid;place-items:center;animation:beat 1.6s ease-in-out infinite}
.big svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--accent);filter:drop-shadow(0 8px 12px rgba(238,111,154,.5))}
.big b{position:relative;color:#fff;font-size:1.5rem;padding-top:6px}
.pre{color:var(--soft);margin:6px 0 0}
.why{font-size:1.35rem;font-weight:600;line-height:2.1;margin:2px 0 14px}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{border:0;background:var(--f2);color:var(--ink);border-radius:99px;padding:10px 20px;font-weight:600}
.nav button[disabled]{opacity:.35}
.x{position:absolute;top:14px;left:16px;border:0;background:none;font-size:1.4rem;color:var(--soft)}
:root{--paper:#fffaf2}@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--paper:#44345c}}:root[data-theme='dark']{--paper:#44345c}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 38%,rgba(255,140,185,.6),transparent 62%);opacity:calc(var(--lit,0)*.85);transition:opacity 1.2s}
.grid .h.seen svg{filter:drop-shadow(0 0 6px #ff6f9f) drop-shadow(0 0 14px rgba(255,111,159,.75))}
.hold{width:min(78vw,300px);display:block;margin:0 auto;cursor:pointer;overflow:visible}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
.hw,.hg{transform-box:fill-box;transform-origin:50% 100%}
svg ellipse[rx='8'][ry='5']{transition:.4s;transform-box:fill-box;transform-origin:center}
.shy ellipse[rx='8'][ry='5']{fill:#ff5f87;opacity:1;transform:scale(1.55)}
.shy .hw,.shy .hg{animation:wig .5s 2}
@keyframes wig{50%{transform:rotate(5deg)}}
.kiss .hw{animation:kl 1.4s}.kiss .hg{animation:kr 1.4s}
@keyframes kl{35%,70%{transform:translate(9px,3px) rotate(11deg)}}
@keyframes kr{35%,70%{transform:translate(-9px,3px) rotate(-11deg)}}
.dance .hw{animation:bn .6s ease-in-out infinite}.dance .hg{animation:bn .6s .3s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-9px) rotate(4deg)}}
.km{position:fixed;z-index:9;font-size:46px;pointer-events:none;animation:kmu 1.4s forwards}
@keyframes kmu{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}30%{opacity:1;transform:translate(-50%,-90%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-190%)}}
.cf{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall 3.4s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
#sheet{display:flex;overflow:auto}
.ev{width:min(100%,420px);margin:auto;background:none;box-shadow:none;padding:0;border-radius:0}
.ev .x{top:2px;left:2px;z-index:5;width:38px;height:38px;border-radius:50%;background:var(--paper)}
.peek svg{width:64%;display:block;margin:0 auto -30px;position:relative;z-index:3;cursor:pointer;overflow:visible}
.env{position:relative;overflow:hidden;border-radius:26px;padding-top:16px}
.env::after{content:'';position:absolute;left:0;right:0;bottom:0;height:130px;background:#f08bb0;z-index:0}
.paper{position:relative;z-index:1;margin:0 16px;background:var(--paper);padding:44px 22px 118px;border-radius:16px 16px 0 0;box-shadow:0 6px 20px rgba(120,60,100,.22);transform:rotate(-.8deg);animation:out 1.1s .3s cubic-bezier(.2,1,.3,1) backwards}
@keyframes out{from{transform:translateY(320px) rotate(0)}}
.paper::before{content:'';position:absolute;top:-10px;left:50%;width:92px;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,160,195,.7)}
.pocket{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:2;background:linear-gradient(160deg,#ffbdd0,#ee6f9a);clip-path:polygon(0 20%,50% 70%,100% 20%,100% 100%,0 100%)}
.seal{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;font-size:2rem}
.ev .big{width:70px;height:64px;margin:0 auto 2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fl{display:none}.hug .mini{opacity:1}}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{min-height:100dvh}
#intro{min-height:100dvh}
@media (max-width:600px){.msg,.why{font-size:1.2rem}.hold{width:min(80vw,300px)}}
</style>
</head>
<body>
<section id="intro">
  <div id="hug1"></div>
  <p class="t1">شروع عشق ما</p>
  <h2 class="t2" style="margin:0">۲۳ آذر ۱۴۰۱</h2>
  <p class="t3">یه سفر کوچیک به دلیل‌های دوست داشتنت</p>
  <button class="go" id="go">بزن بریم تو دنیای ما</button>
</section>

<main id="main" hidden>
  <div id="hug2"></div>
  <h1>۸۰ دلیل برای دوست داشتنت</h1>
  <p class="sub">روی هر قلب بزن تا دلیلش باز شه</p>
    <div class="grid" id="grid"></div>
</main>

<div id="sheet" hidden><div class="box ev" id="box"></div></div>

<script>
// ✏️ دلیل‌ها: بعد از «دوست دارم چون». دلیل شماره ۱۰ خالیه؛ متنش رو تو آرایه بنویس.
const R = ["جنتلمنی","چشم قشنگی","مهربونی","دست و دلبازی","با ادبی","با درکی","هوام و داری","تکیه گاهی","خوب من و میشناسی","بهترین رفیق منی",
"مراقبمی","به علایقم توجه میکنی","برام گل میخری","بهم توجه میکنی","برام کتاب میخری","بهم حس پرنسس بودن میدی","همیشه به داستان کتابام و فیلمام گوش میدی","هیچ وقت بی ال دیدنم و مسخره نکردی","دنیای کی پاپ و می فهمی","باهام کی دراما می بینی",
"مغزت یه مپ واقعی و همیشه توی ادرس‌ها خفنی","ریاضیت از من بهتره و ماشین حسابم شدی بدون مسخره کردنم","ازم ناامید نشدی و با ترسام و کند بودنم راه اومدی تا رانندگی یاد بگیرم و بهترین معلم بودی","یه نوازنده ای و من به استعدادت تو موسیقی افتخار میکنم","وفاداری","چشم و دل پاکی و هیز نیستی","همیشه ازم جلوی بقیه تعریف و دفاع میکنی","به هیچ دختری اجازه نمیدی از مرز بگذره و سریع جوابای جالبت و میدی و پای من و وسط میکشی","تو بدمینتون خفنی و کلا روحیه ورزشکاری داری","تفریح سالمی مثل برد گیم داری",
"همیشه حرف زدن رو انتخاب کردی تو بحث ها نه فرار کردن","اجازه دادی تو این رابطه باهم پخته بشیم و بزرگ بشیم","رابطه سالم و بهم هدیه دادی","خوش هیکل خوش چهره و جذابی","باطنت قشنگ ترین","از یه اوپای کی درامایی هم مردتر و خفن تری","همیشه بهم هدیه های بی مناسبت ریز ریز میدی","اگر 100 تو حسابت باشه حاضری 99 تاش و برای من خرج کنی","همیشه از چهره و اخلاق و نوشتنم تعریف میکنی","همیشه تو کل مراحل زندگیم بهم انگیزه دادی",
"بهم ثابت کردی اولویت زندگیتم","نقطه امنم هستی","هیچ وقت از درد و دل هام سو استفاده نکردی و فقط گوش شنوا بودی","همیشه به خودم و خانواده ام احترام گذاشتی","بدون این که من بگم عکسامون و پروفایلت گذاشتی","میتونم تو هر مسئله ای روت حساب باز کنم","زن ستیز نیستی و همیشه بهم فهموندی ذهنت با کلیشه های جنسیتی پر نشده","همیشه اجازه دادی با راحتی ذهنم رابطه و روندش رو پیش ببریم و منم ذهن سنتی داشتم و صبوری کردی","هیچ وقت مناسبت ها رو یادت نمیره","یه رابطه بی مقصد نخواستی و با ازدواج اوکی بودی",
"همیشه سر پولات بهم اعتماد داشتی که صندوق پس انداز یا مدیریت مالیت بشم","همه چیز رو متعلق به جفتمون می‌دونی و ما برات پررنگ تر از من هست","اجازه ندادی هیچ حسرتی تو این رابطه داشته باشم و به هیچ کس و هیچ رابطه ای حسادت داشته باشم چون رابطه امون بی نقص بود و باهام بهترین رفتار رو داشتی","همیشه باعث افتخارم شدی وقتی تو جمع می‌خواستم از خصلت هات حرف بزنم","تو کشتی گرفتن هم زیادی مراقبمی","کنارت بیشترین آرامش رو دارم","انگیزه زندگی کردن و لذت بردن از زندگی من شدی","اولین های زیادی رو باهات تجربه کردم","همیشه بهت اعتماد داشتم و دلیلی نساختی که بهت شک داشته باشم","خیانت تو ذاتت نیست و قلبت خونه امن من شده",
"هیچ وقت سرم داد نزدی","تو اوج عصبانیت هم حواست به رعایت حد و مرزها هست","وقتی من بین شغل داشتن یا زن خانه دار بودن و نوشتن تو جنگم همیشه گفتی انتخاب من مهمه و ازم توقعی جز بودنم نداشتی","بهم حرفای محبت آمیز میزنی و از به زبون اوردن احساساتت فرار نمیکنی","ازم عکس میگیری و همیشه با حوصله ای تو این مسئله و مشتاقم هستی","سلیقه های یکسان و افکار مشترک و عقاید شبیه بهم داریم","نیمه گمشده واقعی و سرنوشت منی","بدون ترس بهم گفتی روم کراش داشتی یه مدت زیادی و بهم گفتی ارزوی تولدت بودم","برام خانواده بودی و می مونی","همیشه تو تیم من بودی",
"میدونم احساساتمون همیشه دو طرفه بوده و عشقی یک اندازه بهم داریم","مظلوم ترین و صادق ترینی و روحت از قشنگی برق میزنه","یه مرد واقعی و بارها این و ثابت کردی","باهوشی و باعث میشی بشه تو همه چی پزت و داد و بهت افتخار کرد","میدونم بهترین دوست پسری بهترین همسر و بهترین پدر هم خواهی شد","به جای غرق شدن تو افسردگی به خاطر سختی های زندگی و شرایط بد کشور، همیشه ادامه دادی تسلیم نشدی و سعی کردی برای زندگیت برنامه داشته باشی","تو دوست داشتنی ترین آدم دنیایی","ذهن رویاپردازی داری و میشه باهات رویا بافت","منطقی با شرایط برخورد میکنی و مدیریت خوبی داری","با وجود دلایل زیادی که میشه برای دوست داشتنت نام برد من به طور غریزی می‌تونم دیوانه وار عاشقت باشم و عشقم بهت بیشتر و بیشتر می‌شه چون تو لایق این احساس عمیق هستی"];

const $ = id => document.getElementById(id);
const fa = n => Number(n).toLocaleString('fa-IR');
const HEART = '<svg viewBox="0 0 32 29"><path d="M16 28C3 18-1 8 5 3c4-3 9-1 11 4 2-5 7-7 11-4 6 5 2 15-11 25z"/></svg>';

function head(x, rot, body, line, cheek, stripes){
  return `<g transform="translate(${x} 96) rotate(${rot})">
  <path d="M-37-12L-35-50-9-32Z M37-12L35-50 9-32Z" fill="${body}" stroke="${line}" stroke-width="2" stroke-linejoin="round"/>
  <path d="M-31-30L-30-42-20-34Z M31-30L30-42 20-34Z" fill="${cheek}"/>
  <ellipse rx="41" ry="34" fill="${body}" stroke="${line}" stroke-width="2"/>
  ${stripes ? `<path d="M0-33v8M-9-32l2 7M9-32l-2 7" stroke="${line}" stroke-width="3" stroke-linecap="round"/>` : ''}
  <path d="M-23 2q7-9 14 0M9 2q7-9 14 0" fill="none" stroke="#3b2f44" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="-27" cy="13" rx="8" ry="5" fill="${cheek}" opacity=".85"/><ellipse cx="27" cy="13" rx="8" ry="5" fill="${cheek}" opacity=".85"/>
  <ellipse cy="9" rx="3.4" ry="2.5" fill="#f08aa6"/><path d="M-5 15q2.5 3.5 5 0q2.5 3.5 5 0" fill="none" stroke="#3b2f44" stroke-width="1.8" stroke-linecap="round"/></g>`;
}
const CW=['#fffdfb','#e3d3dc','#ffb3c6'],CG=['#c9c6d3','#9d98ae','#f3a5bd'],HP='M16 28C3 18-1 8 5 3c4-3 9-1 11 4 2-5 7-7 11-4 6 5 2 15-11 25z';
function holdSvg(id){return `<svg class='hold' viewBox='0 0 300 235' aria-label='دو گربه یه قلب بزرگ رو با هم نگه داشتن'><defs><linearGradient id='${id}' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ff6b8f'/><stop offset='1' stop-color='#d91e4a'/></linearGradient></defs><ellipse cx='104' cy='175' rx='46' ry='52' fill='${CW[0]}' stroke='${CW[1]}' stroke-width='2'/><ellipse cx='196' cy='175' rx='46' ry='52' fill='${CG[0]}' stroke='${CG[1]}' stroke-width='2'/><g class='hw'>${head(114,6,...CW,false)}</g><g class='hg'>${head(186,-6,...CG,true)}</g><g class='beat'><path transform='translate(92 118) scale(3.5)' d='${HP}' fill='url(#${id})'/><ellipse cx='123' cy='140' rx='10' ry='5' transform='rotate(-35 123 140)' fill='#fff' opacity='.4'/></g><ellipse cx='96' cy='172' rx='14' ry='11' fill='${CW[0]}' stroke='${CW[1]}' stroke-width='2'/><ellipse cx='204' cy='172' rx='14' ry='11' fill='${CG[0]}' stroke='${CG[1]}' stroke-width='2'/></svg>`;}
function pairSvg(){return `<svg viewBox='40 28 220 106' aria-label='دو گربه'><g class='hw'>${head(112,7,...CW,false)}</g><g class='hg'>${head(188,-7,...CG,true)}</g><path transform='translate(141 30) scale(.5)' fill='#ff6f9f' d='${HP}'/></svg>`;}
$('hug1').innerHTML = holdSvg('rg1'); $('hug2').innerHTML = holdSvg('rg2');
document.querySelectorAll('.hold').forEach(h => h.onclick = () => kiss(h)); const hold = document.querySelector('#hug2 .hold');
function shy(el){el.classList.add('shy');setTimeout(()=>el.classList.remove('shy'),1800);}
function kiss(el){el.classList.add('kiss');const r=el.getBoundingClientRect(),m=document.createElement('span');m.className='km';m.textContent='💋';m.style.left=r.left+r.width/2+'px';m.style.top=r.top+r.height/2+'px';document.body.appendChild(m);for(let k=0;k<8;k++)setTimeout(()=>floatHeart(Math.random()*100),k*80);setTimeout(()=>{el.classList.remove('kiss');m.remove();},1500);}
function celebrate(){hold.classList.add('dance');for(let k=0;k<70;k++){const c=document.createElement('span');c.className='cf';c.textContent=['🎉','✨','💖','🎊','💗'][k%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.2+'s';c.style.fontSize=16+Math.random()*16+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),5000);}setTimeout(()=>hold.classList.remove('dance'),7000);}

function floatHeart(x){
  const h = document.createElement('span'); h.className = 'fl';
  h.textContent = ['🤍','🩷','🩶','💗','💕'][Math.floor(Math.random()*5)];
  h.style.left = (x ?? Math.random()*100) + 'vw'; h.style.fontSize = 14 + Math.random()*20 + 'px';
  h.style.animationDuration = 6 + Math.random()*6 + 's';
  document.body.appendChild(h); setTimeout(() => h.remove(), 12500);
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  for (let i = 0; i < 10; i++) setTimeout(floatHeart, i*180);
  setInterval(floatHeart, matchMedia('(max-width:600px)').matches ? 1000 : 650);
}

let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('seen') || '[]')); } catch(e){}
const save = () => { try { localStorage.setItem('seen', JSON.stringify([...seen])); } catch(e){} };

function count(){ document.documentElement.style.setProperty('--lit', seen.size/R.length);  }
R.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'h' + (seen.has(i) ? ' seen' : ''); b.dataset.i = i;
  b.setAttribute('aria-label', 'دلیل ' + fa(i+1));
  b.innerHTML = HEART + `<b>${fa(i+1)}</b>`;
  b.onclick = () => openR(i);
  $('grid').appendChild(b);
});
count();

function openR(i){
  seen.add(i); save(); count();
  document.querySelector(`.h[data-i="${i}"]`).classList.add('seen');
  const t = R[i] || 'این دلیل هنوز نوشته نشده 🤍';
  $('box').innerHTML = `<button class="x" id="x" aria-label="بستن">✕</button>
    <div class="peek">${pairSvg()}</div><div class="env"><div class="paper"><div class="big">${HEART}<b>${fa(i+1)}</b></div>
    <p class="pre">دوست دارم چون</p><p class="why">${t}</p>
    <div class="nav"><button id="pv" ${i===0?'disabled':''}>→ قبلی</button><button id="nx" ${i===R.length-1?'disabled':''}>بعدی ←</button></div></div><div class="pocket"></div><span class="seal">💗</span></div>`;
  $('sheet').hidden = false;
  $('x').onclick = close; $('pv').onclick = () => openR(i-1); $('nx').onclick = () => openR(i+1);
  for (let k = 0; k < 6; k++) setTimeout(() => floatHeart(30 + Math.random()*40), k*90);
  const pk = document.querySelector('.peek svg'); pk.onclick = () => kiss(pk); setTimeout(() => shy(pk), 700); shy(hold);
}
function close(){ $('sheet').hidden = true; if (seen.size === R.length && !window.__c){ window.__c = 1; celebrate(); } }
$('sheet').onclick = e => { if (e.target.id === 'sheet') close(); };
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

$('go').onclick = () => {
  for (let k = 0; k < 28; k++) setTimeout(() => floatHeart(Math.random()*100), k*40);
  $('intro').classList.add('out');
  setTimeout(() => { $('intro').hidden = true; $('main').hidden = false; scrollTo(0,0); }, 800);
};

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
